<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>English Word Game</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #e6f5ff 0%, #fff9e6 100%);
      font-family: 'Comic Sans MS', cursive;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .game-title {
      font-size: 2.5em;
      margin-bottom: 20px;
      color: #1165a8;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0 #b3e6ff;
    }

    .game-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(145, 197, 255, 0.4);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }

    .avatars {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      margin-bottom: 40px;
    }

    .person {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .person1 .avatar {
      background: linear-gradient(135deg, #7ec3ff 0%, #4bbcdc 100%);
    }

    .person2 .avatar {
      background: linear-gradient(135deg, #ffd6e3 0%, #ef92be 100%);
    }

    .face {
      width: 60px;
      height: 60px;
      position: relative;
    }

    .eyes {
      display: flex;
      justify-content: space-around;
      margin-bottom: 10px;
    }

    .eye {
      width: 8px;
      height: 8px;
      background: #333;
      border-radius: 50%;
    }

    .mouth {
      width: 20px;
      height: 10px;
      border: 2px solid #333;
      border-top: none;
      border-radius: 0 0 20px 20px;
      margin: 0 auto;
    }

    .notebook {
      width: 45px;
      height: 35px;
      background: linear-gradient(to right, #ffe1b3 50%, #ffc480 50%);
      border: 2px solid #f7be7f;
      border-radius: 4px;
      position: relative;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 1em;
      color: #1165a8;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      padding: 10px 12px;
      border: 2px solid #55acf1;
      border-radius: 8px;
      font-size: 1em;
      font-family: inherit;
      background: rgba(255, 225, 179, 0.3);
    }

    input:focus {
      outline: none;
      border-color: #1165a8;
      background: rgba(255, 225, 179, 0.6);
    }

    button {
      padding: 12px 24px;
      background: linear-gradient(90deg, #9be6ff 0%, #ffc7eb 100%);
      border: none;
      border-radius: 10px;
      color: #255084;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(155, 230, 255, 0.5);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 24px;
      padding: 16px 20px;
      border-radius: 10px;
      border: 2px solid #96dda0;
      background: #f4fff3;
      color: #18853c;
      font-weight: bold;
      text-align: center;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-wrap: break-word;
    }

    .result.error {
      border-color: #f7d9db;
      background: #fff1f2;
      color: #d20b3c;
    }

    .result.hidden {
      display: none;
    }

    .result.loading {
      color: #1165a8;
      background: #f0f7ff;
      border-color: #b3e6ff;
    }

    @media (max-width: 500px) {
      .game-title {
        font-size: 1.8em;
      }

      .game-container {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="game-title">💡 Word Game 🎉</div>
  
  <div class="game-container">
    <div class="avatars">
      <div class="person person1">
        <div class="avatar">
          <div class="face">
            <div class="eyes">
              <div class="eye"></div>
              <div class="eye"></div>
            </div>
            <div class="mouth"></div>
          </div>
        </div>
        <div class="notebook"></div>
      </div>

      <div class="person person2">
        <div class="avatar">
          <div class="face">
            <div class="eyes">
              <div class="eye"></div>
              <div class="eye"></div>
            </div>
            <div class="mouth"></div>
          </div>
        </div>
        <div class="notebook"></div>
      </div>
    </div>

    <form id="gameForm">
      <div class="form-group">
        <label>Word starts with:</label>
        <input type="text" id="start" maxlength="1" required placeholder="A">
      </div>

      <div class="form-group">
        <label>Word ends with:</label>
        <input type="text" id="end" maxlength="1" required placeholder="T">
      </div>

      <div class="form-group">
        <label>Enter word:</label>
        <input type="text" id="word" required placeholder="apple">
      </div>

      <button type="submit">CHECK</button>
    </form>

    <div class="result hidden" id="result"></div>
  </div>

  <script>
    const form = document.getElementById('gameForm');
    const resultDiv = document.getElementById('result');
    const button = form.querySelector('button');

    async function checkWord(start, end, word) {
      start = start.toLowerCase();
      end = end.toLowerCase();
      word = word.toLowerCase();

      // Check start letter
      if (start !== word[0]) {
        return {
          ok: false,
          message: `Word must START with '${start.toUpperCase()}', but '${word}' starts with '${word[0].toUpperCase()}'`
        };
      }

      // Check end letter
      if (end !== word[word.length - 1]) {
        return {
          ok: false,
          message: `Word must END with '${end.toUpperCase()}', but '${word}' ends with '${word[word.length - 1].toUpperCase()}'`
        };
      }

      // Check if word exists using Dictionary API
      try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
        if (response.ok) {
          const data = await response.json();
          const definition = data[0]?.meanings?.[0]?.definitions?.[0]?.definition || 'Word is valid!';
          return {
            ok: true,
            message: `✓ "${word.toUpperCase()}" is correct! Definition: ${definition}`
          };
        } else {
          return {
            ok: false,
            message: `"${word.toUpperCase()}" is NOT a valid English word!`
          };
        }
      } catch (error) {
        return {
          ok: false,
          message: `Error checking word: ${error.message}`
        };
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const start = document.getElementById('start').value.trim();
      const end = document.getElementById('end').value.trim();
      const word = document.getElementById('word').value.trim();

      button.disabled = true;
      resultDiv.classList.remove('hidden', 'error');
      resultDiv.classList.add('loading');
      resultDiv.textContent = '⏳ Checking...';

      const result = await checkWord(start, end, word);

      resultDiv.classList.remove('loading');

      if (result.ok) {
        resultDiv.classList.remove('error');
        resultDiv.textContent = '✅ ' + result.message;
      } else {
        resultDiv.classList.add('error');
        resultDiv.textContent = '❌ ' + result.message;
      }

      button.disabled = false;
      resultDiv.classList.remove('hidden');
    });
  </script>
</body>
</html>
