<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>English Word Game - Start & End Letter</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #e6f5ff 0%, #fff9e6 100%);
      font-family: 'Comic Sans MS', 'Comic Sans', cursive;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .game-title {
      font-size: 2.5em;
      margin-top: 30px;
      color: #1165a8;
      letter-spacing: 2px;
      text-shadow: 3px 3px 0 #b3e6ff;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .game-container {
      background: linear-gradient(to bottom, #ffffff 0%, #fff9e6 100%);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(145, 197, 255, 0.4);
      padding: 40px 50px;
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 600px;
      width: 100%;
    }

    .avatars {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-bottom: 30px;
      gap: 60px;
      width: 100%;
    }

    .person {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .notebook {
      background: linear-gradient(to right, #ffe1b3 0%, #ffc480 100%);
      border: 4px solid #f7be7f;
      border-radius: 8px;
      width: 50px;
      height: 45px;
      margin: -15px 0 0 0;
      position: relative;
      z-index: 2;
      box-shadow: 0 4px 10px rgba(250, 209, 156, 0.5);
      animation: hold 1.5s ease-in-out infinite;
    }

    .notebook::before {
      content: '';
      position: absolute;
      width: 40%;
      height: 100%;
      left: 0;
      background: #ffd89b;
      border-right: 2px solid #e6b875;
      border-radius: 6px 0 0 6px;
    }

    @keyframes hold {
      0%, 100% { transform: rotateZ(-2deg); }
      50% { transform: rotateZ(2deg); }
    }

    .person1 .avatar {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle at 35px 20px, #7ec3ff 50%, #4bbcdc 100%);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 5px 15px rgba(75, 188, 220, 0.3);
    }

    .person2 .avatar {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle at 35px 20px, #ffd6e3 60%, #ef92be 100%);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 5px 15px rgba(239, 146, 190, 0.3);
    }

    .eyes {
      width: 10px;
      height: 10px;
      background: #255084;
      border-radius: 50%;
      position: absolute;
      top: 32px;
      animation: blink 3s infinite;
    }

    .left-eye {
      left: 22px;
    }

    .right-eye {
      right: 22px;
    }

    @keyframes blink {
      0%, 90%, 100% { height: 10px; }
      95% { height: 2px; }
    }

    .smile {
      width: 30px;
      height: 18px;
      border-bottom: 4px solid #255084;
      position: absolute;
      left: 30px;
      top: 48px;
      border-radius: 0 0 25px 25px;
      background: transparent;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 22px;
      align-items: center;
      width: 100%;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    label {
      font-size: 1.15em;
      color: #39638f;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      padding: 12px 18px;
      border-radius: 10px;
      border: 3px solid #55acf1;
      background: rgba(255, 225, 179, 0.5);
      font-size: 1.1em;
      width: 100%;
      max-width: 280px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      background: rgba(255, 225, 179, 0.8);
      border-color: #1165a8;
      box-shadow: 0 0 15px rgba(17, 101, 168, 0.3);
      transform: scale(1.05);
    }

    input::placeholder {
      color: #a8bfd4;
    }

    button {
      background: linear-gradient(90deg, #9be6ff 0%, #ffc7eb 100%);
      color: #255084;
      font-size: 1.2em;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      padding: 14px 40px;
      box-shadow: 0 5px 15px rgba(175, 238, 247, 0.5);
      transition: all 0.3s ease;
      font-family: inherit;
      margin-top: 10px;
      cursor: pointer;
    }

    button:hover {
      background: linear-gradient(90deg, #b4d3ff 0%, #fad3fb 100%);
      box-shadow: 0 8px 20px rgba(225, 244, 250, 0.6);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
      box-shadow: 0 3px 10px rgba(175, 238, 247, 0.4);
    }

    .result {
      font-size: 1.1em;
      padding: 20px 30px;
      background: linear-gradient(to right, #f4fff3 0%, #e8ffe8 100%);
      margin-top: 30px;
      border-radius: 12px;
      border: 3px dashed #96dda0;
      color: #18853c;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(212, 255, 232, 0.5);
      max-width: 100%;
      text-align: center;
      word-break: break-word;
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result.error {
      color: #d20b3c;
      background: linear-gradient(to right, #fff1f2 0%, #ffe8ec 100%);
      border-color: #f7d9db;
      box-shadow: 0 4px 12px rgba(242, 217, 219, 0.5);
    }

    .result.loading {
      color: #1165a8;
      background: linear-gradient(to right, #f0f7ff 0%, #e8f4ff 100%);
      border-color: #b3e6ff;
    }

    @media (max-width: 600px) {
      .game-title {
        font-size: 1.8em;
      }

      .game-container {
        padding: 30px 20px;
      }

      .avatars {
        gap: 40px;
      }

      .person1 .avatar,
      .person2 .avatar {
        width: 70px;
        height: 70px;
      }

      .notebook {
        width: 40px;
        height: 35px;
      }
    }
  </style>
</head>
<body>
  <div class="game-title">💡 English Word Start/End Game 🎉</div>
  
  <div class="game-container">
    <div class="avatars">
      <!-- Person 1 (Blue) -->
      <div class="person person1">
        <div class="avatar">
          <div class="eyes left-eye"></div>
          <div class="eyes right-eye"></div>
          <div class="smile"></div>
        </div>
        <div class="notebook"></div>
      </div>

      <!-- Person 2 (Pink) -->
      <div class="person person2">
        <div class="avatar">
          <div class="eyes left-eye"></div>
          <div class="eyes right-eye"></div>
          <div class="smile"></div>
        </div>
        <div class="notebook"></div>
      </div>
    </div>

    <form id="wordForm" autocomplete="off">
      <div class="form-group">
        <label>🔤 Word should start with:</label>
        <input 
          type="text" 
          name="start" 
          id="start" 
          maxlength="1" 
          required 
          placeholder="e.g., A"
        />
      </div>

      <div class="form-group">
        <label>🔤 Word should end with:</label>
        <input 
          type="text" 
          name="end" 
          id="end" 
          maxlength="1" 
          required 
          placeholder="e.g., T"
        />
      </div>

      <div class="form-group">
        <label>📝 Enter your word:</label>
        <input 
          type="text" 
          name="word" 
          id="word" 
          required 
          placeholder="Type a word"
        />
      </div>

      <button type="submit">✨ Check ✨</button>
    </form>

    <div class="result" id="result" style="display:none"></div>
  </div>

  <script>
    document.getElementById("wordForm").onsubmit = async function(e) {
      e.preventDefault();
      
      const result = document.getElementById("result");
      result.style.display = "block";
      result.classList.remove("error");
      result.classList.add("loading");
      result.textContent = "⏳ Checking your word...";

      const start = document.getElementById("start").value.trim();
      const end = document.getElementById("end").value.trim();
      const word = document.getElementById("word").value.trim();

      try {
        const res = await fetch("/check", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ start, end, word })
        });

        const data = await res.json();

        result.classList.remove("loading");

        if (data.ok) {
          result.textContent = "✅ " + data.message;
          result.classList.remove("error");
        } else {
          result.textContent = "❌ " + data.message;
          result.classList.add("error");
        }
      } catch (err) {
        result.classList.remove("loading");
        result.textContent = "❌ There was an error. Please try again.";
        result.classList.add("error");
      }
    };
  </script>
</body>
</html>
